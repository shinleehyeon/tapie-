<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>쌈뽕 디지털 시계</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="clock">
        <div id="time"></div>
    </div>
    <script>
        function updateTime() {
            const now = new Date();
            const time = now.toLocaleTimeString('ko-KR');
            document.getElementById('time').textContent = time;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
